name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0, or leave empty for auto-tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK licenses & setup NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Apply generated code patches
        run: |
          python3 patches/generated/apply_generated_patches.py

      - name: Build Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare release artifact
        run: |
          mkdir -p release_assets
          cp android/app/build/outputs/apk/release/app-release.apk release_assets/dantes_inferno_arm64.apk
          ls -lh release_assets/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dantes_inferno_arm64
          path: release_assets/dantes_inferno_arm64.apk

      - name: Determine Release Tag & Title
        id: release_info
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Dante's Inferno Android ${TAG}"
            IS_PRERELEASE="false"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            TITLE="Dante's Inferno Android ${TAG}"
            IS_PRERELEASE="false"
          else
            TAG="v1.0.0-build.${{ github.run_number }}"
            TITLE="Dante's Inferno Android (${TAG})"
            IS_PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: >-
          (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: release_assets/dantes_inferno_arm64.apk
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          body: |
            ### Dante's Inferno (Xbox 360) - Port Nativo Android ARM64
            
            Versão compilada automaticamente via GitHub Actions.
            
            #### Características do APK:
            - **Arquitetura**: `arm64-v8a` (Android 8.0+ / API 26+)
            - **Instalador de ISO Embutido**: Extrai e roda diretamente da imagem ISO original do Xbox 360 sem necessidade de computador.
            - **Controles**: Controles virtuais na tela de toque customizados + suporte a gamepads USB/Bluetooth (Xbox / PlayStation / genéricos).
            - **Motor Gráfico Vulkan**: Suporte a drivers customizados AdrenoTools (Turnip) com cache de shaders persistente em disco.
            - **HUD de Desempenho**: Contador em tempo real de FPS e Frametime (ms) lendo diretamente os quadros de emulação do Xbox 360 (`VdSwap`).
            
            #### Como Instalar:
            1. Baixe o arquivo `dantes_inferno_arm64.apk` abaixo.
            2. Instale no seu celular Android (certifique-se de permitir instalação de fontes desconhecidas).
            3. Abra o app, selecione a ISO do Dante's Inferno do Xbox 360 e aproveite!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
